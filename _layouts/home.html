---
layout: default
---

{% include lang.html %}

<div class="home-sections">
  <header class="home-hero">
    <p class="home-subtitle home-hero-animate">{{ site.tagline }}</p>
    <p class="home-desc home-hero-animate home-hero-delay">Explore my work, talks, and writings</p>
  </header>

  <div class="section-cards">
    {% for section in site.data.sections %}
    <a href="{{ section.url | relative_url }}" class="section-card section-card-animate" style="--accent: {{ section.accent }}; --card-anim-delay: {{ forloop.index0 }};">
      <span class="section-card-icon"><i class="{{ section.icon }}"></i></span>
      <div class="section-card-content">
        <h3 class="section-card-title">{{ section.title }}</h3>
        <p class="section-card-desc">{{ section.description }}</p>
      </div>
      <span class="section-card-arrow"><i class="fas fa-arrow-right"></i></span>
    </a>
    {% endfor %}
  </div>
</div>

<style>
.home-sections {
  padding: 2rem 0 3rem;
  max-width: 900px;
  margin: 0 auto;
}

.home-hero {
  text-align: center;
  margin-bottom: 3rem;
  position: relative;
}

.home-hero::before {
  content: '';
  position: absolute;
  top: -20%;
  left: 50%;
  transform: translateX(-50%);
  width: 120%;
  height: 140%;
  background: radial-gradient(ellipse at center, var(--portfolio-accent-dim, rgba(0,212,170,0.08)) 0%, transparent 70%);
  pointer-events: none;
}

.home-hero-animate {
  opacity: 0;
  animation: homeFadeIn 0.7s ease forwards;
}

.home-hero-delay {
  animation-delay: 0.2s;
  opacity: 0;
}

@keyframes homeFadeIn {
  to { opacity: 1; }
}

.home-subtitle {
  font-size: 1.15rem;
  opacity: 0.9;
  margin-bottom: 0.5rem;
  position: relative;
}

.home-desc {
  font-size: 0.95rem;
  opacity: 0.75;
  position: relative;
}

.section-cards {
  display: grid;
  gap: 1.25rem;
}

.section-card {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  padding: 1.5rem 1.75rem;
  border-radius: 12px;
  text-decoration: none;
  color: inherit;
  background: var(--portfolio-card-bg, #252525);
  border: 1px solid var(--portfolio-card-border, rgba(255,255,255,0.08));
  transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
}

.section-card-animate {
  opacity: 0;
  animation: cardFadeIn 0.6s ease forwards;
  animation-delay: calc(0.1s + var(--card-anim-delay, 0) * 0.08s);
}

@keyframes cardFadeIn {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.section-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 32px rgba(0,0,0,0.25), 0 0 0 1px var(--accent, #00d4aa);
  border-color: var(--accent, #00d4aa);
}

@media (prefers-color-scheme: light) {
  html:not([data-mode="dark"]) .section-card:hover {
    box-shadow: 0 12px 32px rgba(0,0,0,0.12), 0 0 0 1px var(--accent);
  }
}

.section-card-icon {
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  background: color-mix(in srgb, var(--accent) 18%, transparent);
  color: var(--accent);
  font-size: 1.25rem;
  flex-shrink: 0;
  transition: transform 0.25s ease, background 0.25s ease;
}

.section-card:hover .section-card-icon {
  transform: scale(1.05);
  background: color-mix(in srgb, var(--accent) 25%, transparent);
}

.section-card-content {
  flex: 1;
  min-width: 0;
}

.section-card-title {
  font-size: 1.15rem;
  font-weight: 600;
  margin: 0 0 0.35rem 0;
}

.section-card-desc {
  font-size: 0.9rem;
  opacity: 0.75;
  margin: 0;
  line-height: 1.45;
}

.section-card-arrow {
  color: var(--accent);
  opacity: 0.6;
  transition: transform 0.25s ease, opacity 0.25s ease;
}

.section-card:hover .section-card-arrow {
  transform: translateX(6px);
  opacity: 1;
}

@media (prefers-reduced-motion: reduce) {
  .home-hero-animate,
  .home-hero-delay,
  .section-card-animate {
    animation: none;
    opacity: 1;
  }
}
</style>
